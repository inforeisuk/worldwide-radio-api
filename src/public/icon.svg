<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Circle -->
  <rect width="512" height="512" rx="128" fill="#090d16"/>
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#grad)" stroke-width="12" opacity="0.4"/>
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#grad)" stroke-width="8" opacity="0.6"/>
  
  <!-- Radio Waves -->
  <path d="M 170 210 A 110 110 0 0 1 342 210" fill="none" stroke="url(#grad)" stroke-width="14" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M 205 240 A 65 65 0 0 1 307 240" fill="none" stroke="url(#grad)" stroke-width="14" stroke-linecap="round"/>
  
  <!-- Center Signal Dot / Antenna -->
  <circle cx="256" cy="275" r="26" fill="url(#grad)"/>
  
  <!-- Equalizer Bars -->
  <rect x="180" y="335" width="18" height="55" rx="9" fill="#3b82f6"/>
  <rect x="215" y="315" width="18" height="75" rx="9" fill="#6366f1"/>
  <rect x="250" y="295" width="18" height="95" rx="9" fill="#8b5cf6"/>
  <rect x="285" y="320" width="18" height="70" rx="9" fill="#d946ef"/>
  <rect x="320" y="340" width="18" height="50" rx="9" fill="#ec4899"/>
</svg>
